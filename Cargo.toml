# Modified by the local-resource-coordinator fork, 2026-10-02: the portable
# test job `testjob` and the `test-fixtures` feature that the e2e suite needs.
[package]
name = "qex"
# NOT the version of a release. `main` holds this number for ever, and no pull
# request changes it. The number of a release lives on the tag, and on the one
# commit that the tag names; `build.rs` gives a build its own name. Read
# CONTRIBUTING.md and `src/version.rs`.
version = "0.0.0-dev"
edition = "2021"
description = "Queued EXecutor — shared admission control for independent local agents"
license = "Apache-2.0"
repository = "https://github.com/stephenc/qex"
homepage = "https://stephenc.github.io/qex"
documentation = "https://stephenc.github.io/qex"
readme = "README.md"
keywords = ["queue", "scheduler", "jobs", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The version of Rust that qex needs. The lock file has the format 4, which
# needs 1.78, and one dependency uses the 2024 edition, which needs 1.85. The
# number below is that floor, and CI proves it on each change.
rust-version = "1.85"
# The files that a person needs to build and use qex. The state of a build is
# large, and it belongs to no other machine.
exclude = ["/.github", "/target", "/docs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
anyhow = "1"
clap_complete = "4.6.9"

# `testjob` is a job for the end-to-end tests that runs on every platform (see
# tests/fixtures/testjob.rs). It is built only with this feature, so
# `cargo install` never installs it. The e2e suite needs it, so the suite needs
# the feature too: run it with `--features test-fixtures`.
[features]
test-fixtures = []

[[bin]]
name = "testjob"
path = "tests/fixtures/testjob.rs"
required-features = ["test-fixtures"]

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["test-fixtures"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
