# Modified by the local-resource-coordinator fork, 2026-11-03: no longer names
# upstream's site; this fork publishes no site, and the Pages workflow is gone.
#
# Jekyll settings for `docs`, kept for a site that the project may publish
# later. Nothing builds or deploys a site from this directory now.
title: local-resource-coordinator
