# Modified by the local-resource-coordinator fork, 2026-09-30: macOS jobs moved
# to macos.yml (weekly and on demand) to save private-repo Actions minutes.
# Modified by the local-resource-coordinator fork, 2026-10-02: the Style job
# rejects raw control characters in text files.
# Modified by the local-resource-coordinator fork, 2026-10-02: clippy, the
# end-to-end tests and the MSRV check build with --features test-fixtures.
# Modified by the local-resource-coordinator fork, 2026-10-05: the Style job
# runs the tests of the move checker, and the Move check job runs the base
# revision's checker on refactor/ pull requests.
name: CI

# Every push and every pull request. The release workflow runs the same tests
# again on main, because a release must never come from an untested commit.
on:
  push:
    branches: [main]
  pull_request:

# A new push to one branch stops the run of the earlier push. The result of the
# earlier push has no value once a newer commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Test the check first: a broken check that passes everything would look
      # like a clean repository.
      - name: The tests of the control-character check
        run: python3 .github/scripts/check-control-chars-test.py
      - name: No raw control characters in text files
        run: python3 .github/scripts/check-control-chars.py
      - name: The tests of the move checker
        run: python3 .github/scripts/check-moves-test.py
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: The layout of the code
        run: cargo fmt --all --check
      - name: The advice of clippy
        # The feature builds `testjob` and the e2e suite, which need it; without
        # it, clippy would skip them.
        run: cargo clippy --features test-fixtures --all-targets -- -D warnings

  # The R-PRs of docs/fork/PORT_PLAN.md only move code. Their "not a move" lines
  # are expected and explained in the PR, so only a checker error fails the job;
  # the reviewer compares the job summary with those explanations.
  moves:
    name: Move check
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'refactor/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check that the code only moves
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        # The checker comes from the base revision. This job itself runs from the PR,
        # so a PR could still change it; the summary then warns about .github/.
        run: |
          set +e
          mb=$(git merge-base "$BASE" HEAD)
          {
            git show "$BASE:.github/scripts/check-moves.py" > "$RUNNER_TEMP/check-moves.py" \
              && python3 "$RUNNER_TEMP/check-moves.py" "$mb" HEAD
          } > moves.txt 2>&1
          code=$?
          cat moves.txt
          {
            if ! git diff --quiet "$mb" HEAD -- .github/; then
              echo "**Warning: this PR changes .github/, which holds this job and the"
              echo "checker. Read that diff before trusting this result.**"
              echo
            fi
            echo "## Move check: exit $code"
            echo "0: every changed function has a byte-identical copy; 1: some have none;"
            echo "anything else: the checker failed. At 0 or 1, the PR must explain every"
            echo "line listed below."
            echo
            # ASCII-only and HTML-escaped, so nothing in a path or line can end the block,
            # add a line or reorder text.
            echo '<pre>'
            python3 -c '
          import html, sys
          sys.stdin.reconfigure(errors="replace")
          text = "".join(c if " " <= c <= "~" or c == "\n" else "\\u{%04X}" % ord(c)
                         for c in sys.stdin.read())
          sys.stdout.write(html.escape(text))' < moves.txt
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 1 ]

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each version is named, and `ubuntu-latest` is not used. qex reads
        # /proc and controls processes, so the version of the system is part of
        # the test. A name that moves would change the test with no commit, and
        # a failure would then have no cause that a person can see.
        #
        # Two versions of Ubuntu, because a fault that appears on one of them
        # and not on the other says immediately where to look.
        #
        # Fork: macos-14 runs in macos.yml, weekly and on demand.
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: The unit tests
        run: cargo test --bins
      # The end-to-end tests start real processes, and a coordinator makes a
      # decision from the load of the machine. Two of these tests together on a
      # shared machine change that load, so they run two at a time at the most.
      - name: The end-to-end tests
        run: cargo test --features test-fixtures --test e2e -- --test-threads=2

  # The rules that give the version number of every release.
  #
  # Those rules live in bash, so no test of the Rust code reaches them. This job
  # takes a few seconds: it makes small git repositories in a temporary
  # directory, and it needs no network and no cargo.
  version:
    name: The rules for the version number
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: .github/actions/compute-version/test.sh

  # What `build.rs` makes a binary report.
  #
  # A wrong answer there is invisible until somebody reads a fault report, and
  # the shapes that break it — a package inside a repository that belongs to
  # somebody else — appear on the machine of a user and never here. The test
  # builds a copy of the package in each of those shapes, so it needs cargo and
  # it does not run in the fast job above.
  build-version:
    name: The version that a build reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-version
      - run: .github/scripts/build-version-test.sh

  # Cargo.toml names the earliest version of Rust that qex needs. A number that
  # nothing tests is a guess, and a user with that version meets the error.
  msrv:
    name: The earliest Rust that qex needs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Read the number from Cargo.toml
        id: msrv
        run: |
          version="$(awk -F'"' '/^rust-version *= *"/ { print $2; exit }' Cargo.toml)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Cargo.toml says that qex needs Rust $version."
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo +${{ steps.msrv.outputs.version }} check --features test-fixtures --all-targets --locked

  # The form of the title of a pull request is in `pr-title.yml`, and not here.
  #
  # That test must run again when a person changes the title, which is an
  # `edited` event and not a push. This workflow must NOT run on `edited`: it
  # would build the four release targets and run the tests on three machines
  # each time a person corrects a word.

  # Prove that each target of the release builds, before a merge to main and not
  # after it. A release that fails to build for one machine is a release that
  # must be made again.
  cross:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          # Fork: the two apple-darwin targets build in macos.yml.
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # qex has no dependency that holds C, so the linker of Rust itself can
      # make a binary for another machine. No other toolchain is necessary.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
