[package]
name = "jobobject-probe"
version = "0.1.0"
edition = "2024"
description = "Decision-gate experiment: native Windows process-tree ownership with Job Objects. Not part of qex."
license = "Apache-2.0"
publish = false

# Standalone: not a member of the qex package at the repository root.
[workspace]

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]
